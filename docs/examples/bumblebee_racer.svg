<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="avatar-clip">
      <rect x="0" y="0" width="256" height="256" rx="20" ry="20" />
    </clipPath>
    <linearGradient id="bg-grad-linear" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FEF9C3" /><stop offset="100%" stop-color="#FEF08A" /></linearGradient>
    <radialGradient id="bg-grad-radial" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#FEF08A" /><stop offset="100%" stop-color="#FEF9C3" /></radialGradient>
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#EAB308" /><stop offset="100%" stop-color="#CA8A04" /></linearGradient>
    <linearGradient id="metal-shine" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" /><stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0" /><stop offset="100%" stop-color="#000000" stop-opacity="0.15" /></linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" fill="#FEF9C3" />
  <g clip-path="url(#avatar-clip)">
  <!-- Antenna / Top Gadget -->
  <rect x="124" y="24" width="8" height="32" rx="4" fill="#CA8A04" stroke="#1C1502" stroke-width="3" />  <circle cx="128" cy="22" r="13" fill="#F97316" stroke="#1C1502" stroke-width="3.5" />  <circle cx="124" cy="18" r="4" fill="#FFFFFF" />
  <!-- Neck -->
  <rect x="104" y="168" width="48" height="26" rx="5" fill="#CA8A04" stroke="#1C1502" stroke-width="3.5" />
  <circle cx="112" cy="181" r="3" fill="#1C1502" />  <circle cx="128" cy="181" r="3" fill="#1C1502" />  <circle cx="144" cy="181" r="3" fill="#1C1502" />
  <!-- Torso -->
  <path d="M 52 256 L 66 198 Q 72 188 84 188 L 172 188 Q 184 188 190 198 L 204 256 Z" fill="url(#chassis-grad)" stroke="#1C1502" stroke-width="5" />
  <path d="M 84 188 L 172 188 L 166 198 L 90 198 Z" fill="#CA8A04" opacity="0.7" />
  <!-- Chest Badge -->
  <circle cx="128" cy="224" r="16" fill="#1C1502" />  <polygon points="129,214 121,224 127,224 125,234 135,223 129,223" fill="#F97316" />
  <!-- Ears / Side Attachments -->
  <circle cx="44" cy="115" r="15" fill="#CA8A04" stroke="#1C1502" stroke-width="3.5" />  <circle cx="44" cy="115" r="7" fill="#F97316" />  <circle cx="212" cy="115" r="15" fill="#CA8A04" stroke="#1C1502" stroke-width="3.5" />  <circle cx="212" cy="115" r="7" fill="#F97316" />
  <!-- Robot Cat Ears -->
  <polygon points="56,80 82,30 102,72" fill="#EAB308" stroke="#1C1502" stroke-width="4" stroke-linejoin="round" />  <polygon points="64,74 82,42 94,68" fill="#F97316" />  <polygon points="200,80 174,30 154,72" fill="#EAB308" stroke="#1C1502" stroke-width="4" stroke-linejoin="round" />  <polygon points="192,74 174,42 162,68" fill="#F97316" />
  <!-- Head Base -->
  <rect x="48" y="54" width="160" height="124" rx="26" ry="26" fill="url(#chassis-grad)" stroke="#1C1502" stroke-width="5" />
  <circle cx="68" cy="68" r="3.5" fill="#1C1502" />  <circle cx="128" cy="64" r="3.5" fill="#1C1502" />  <circle cx="188" cy="68" r="3.5" fill="#1C1502" />
  <!-- Faceplate Screen -->
  <rect x="66" y="74" width="124" height="88" rx="18" ry="18" fill="#18181B" stroke="#1C1502" stroke-width="3" />
  <!-- Eyes / Eyewear -->
  <polygon points="74,94 124,94 118,122 82,122" fill="#1C1502" />  <polygon points="76,96 122,96 116,120 84,120" fill="#1C1502" />  <polygon points="132,94 182,94 174,122 138,122" fill="#1C1502" />  <polygon points="134,96 180,96 172,120 140,120" fill="#1C1502" />  <line x1="118" y1="96" x2="138" y2="96" stroke="#1C1502" stroke-width="5" />  <line x1="56" y1="96" x2="76" y2="96" stroke="#1C1502" stroke-width="3.5" />  <line x1="180" y1="96" x2="200" y2="96" stroke="#1C1502" stroke-width="3.5" />  <line x1="82" y1="102" x2="114" y2="102" stroke="#FFFFFF" stroke-width="2.5" opacity="0.7" stroke-linecap="round" />  <line x1="140" y1="102" x2="172" y2="102" stroke="#FFFFFF" stroke-width="2.5" opacity="0.7" stroke-linecap="round" />
  <!-- Cheeks -->
  <circle cx="76" cy="133" r="2.5" fill="#1C1502" />  <circle cx="82" cy="136" r="2.5" fill="#1C1502" />  <circle cx="88" cy="133" r="2.5" fill="#1C1502" />  <circle cx="168" cy="133" r="2.5" fill="#1C1502" />  <circle cx="174" cy="136" r="2.5" fill="#1C1502" />  <circle cx="180" cy="133" r="2.5" fill="#1C1502" />
  <!-- Mouth / Expression -->
  <rect x="108" y="134" width="40" height="16" rx="4" fill="#1C1502" />  <rect x="112" y="136" width="6" height="12" rx="1" fill="#FFFFFF" />  <rect x="120" y="136" width="6" height="12" rx="1" fill="#FFFFFF" />  <rect x="128" y="136" width="6" height="12" rx="1" fill="#FFFFFF" />  <rect x="136" y="136" width="6" height="12" rx="1" fill="#FFFFFF" />
  <!-- Hat -->
  <polygon points="128,14 100,60 156,60" fill="#F97316" stroke="#1C1502" stroke-width="4" stroke-linejoin="round" />  <polygon points="128,14 116,60 140,60" fill="#CA8A04" />  <circle cx="128" cy="14" r="8" fill="#38BDF8" stroke="#1C1502" stroke-width="3" />  <ellipse cx="128" cy="60" rx="28" ry="6" fill="#CA8A04" stroke="#1C1502" stroke-width="3" />
  </g>
</svg>
