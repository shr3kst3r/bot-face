<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="avatar-clip">
      <rect x="0" y="0" width="256" height="256" rx="28" ry="28" />
    </clipPath>
    <linearGradient id="bg-grad-linear" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#CCFBF1" /><stop offset="100%" stop-color="#99F6E4" /></linearGradient>
    <radialGradient id="bg-grad-radial" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#99F6E4" /><stop offset="100%" stop-color="#CCFBF1" /></radialGradient>
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#14B8A6" /><stop offset="100%" stop-color="#0D9488" /></linearGradient>
    <linearGradient id="metal-shine" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" /><stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0" /><stop offset="100%" stop-color="#000000" stop-opacity="0.15" /></linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" fill="url(#bg-grad-radial)" />
  <g clip-path="url(#avatar-clip)">
  <!-- Neck -->
  <rect x="104" y="168" width="48" height="26" rx="5" fill="#0D9488" stroke="#052420" stroke-width="3.5" />
  <circle cx="112" cy="181" r="3" fill="#052420" />  <circle cx="128" cy="181" r="3" fill="#052420" />  <circle cx="144" cy="181" r="3" fill="#052420" />
  <!-- Torso -->
  <path d="M 52 256 L 66 198 Q 72 188 84 188 L 172 188 Q 184 188 190 198 L 204 256 Z" fill="url(#chassis-grad)" stroke="#052420" stroke-width="5" />
  <path d="M 84 188 L 172 188 L 166 198 L 90 198 Z" fill="#0D9488" opacity="0.7" />
  <!-- Chest Badge -->
  <path d="M 116 214 L 140 214 L 140 224 Q 140 234 128 238 Q 116 234 116 224 Z" fill="#A855F7" stroke="#052420" stroke-width="2.5" />  <circle cx="128" cy="224" r="3.5" fill="#042F2E" />
  <!-- Ears / Side Attachments -->
  <circle cx="44" cy="115" r="15" fill="#0D9488" stroke="#052420" stroke-width="3.5" />  <circle cx="44" cy="115" r="7" fill="#A855F7" />  <circle cx="212" cy="115" r="15" fill="#0D9488" stroke="#052420" stroke-width="3.5" />  <circle cx="212" cy="115" r="7" fill="#A855F7" />
  <!-- Head Base -->
  <path d="M 50 172 L 50 114 Q 50 48 128 48 Q 206 48 206 114 L 206 172 Q 206 178 198 178 L 58 178 Q 50 178 50 172 Z" fill="url(#chassis-grad)" stroke="#052420" stroke-width="5" />
  <!-- Faceplate Screen -->
  <rect x="66" y="74" width="124" height="88" rx="18" ry="18" fill="#042F2E" stroke="#052420" stroke-width="3" />
  <!-- Eyes / Eyewear -->
  <path d="M 86 108 L 98 96 L 110 108" fill="none" stroke="#052420" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />  <path d="M 86 108 L 98 96 L 110 108" fill="none" stroke="#67E8F9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="158" cy="106" r="17" fill="#052420" />  <circle cx="158" cy="106" r="14" fill="#67E8F9" />  <circle cx="158" cy="106" r="9" fill="#052420" />  <circle cx="155" cy="102" r="4.5" fill="#FFFFFF" />  <circle cx="162" cy="110" r="2" fill="#FFFFFF" />
  <!-- Cheeks -->
  <line x1="74" y1="130" x2="78" y2="138" stroke="#F472B6" stroke-width="3" stroke-linecap="round" />  <line x1="80" y1="130" x2="84" y2="138" stroke="#F472B6" stroke-width="3" stroke-linecap="round" />  <line x1="86" y1="130" x2="90" y2="138" stroke="#F472B6" stroke-width="3" stroke-linecap="round" />  <line x1="166" y1="130" x2="170" y2="138" stroke="#F472B6" stroke-width="3" stroke-linecap="round" />  <line x1="172" y1="130" x2="176" y2="138" stroke="#F472B6" stroke-width="3" stroke-linecap="round" />  <line x1="178" y1="130" x2="182" y2="138" stroke="#F472B6" stroke-width="3" stroke-linecap="round" />
  <!-- Mouth / Expression -->
  <path d="M 108 136 Q 128 154 148 136" fill="none" stroke="#052420" stroke-width="7" stroke-linecap="round" />  <path d="M 108 136 Q 128 154 148 136" fill="none" stroke="#67E8F9" stroke-width="4.5" stroke-linecap="round" />  <circle cx="108" cy="136" r="3" fill="#052420" />  <circle cx="148" cy="136" r="3" fill="#052420" />
  <!-- Hat -->
  <ellipse cx="128" cy="58" rx="62" ry="11" fill="#052420" />  <path d="M 86 56 C 86 28, 170 28, 170 56 Z" fill="#052420" />  <path d="M 90 56 C 90 32, 166 32, 166 56 Z" fill="#052420" />  <path d="M 90 53 Q 128 49 166 53 L 166 56 Q 128 52 90 56 Z" fill="#A855F7" />
  </g>
</svg>
