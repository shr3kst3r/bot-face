<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="avatar-clip">
      <rect x="0" y="0" width="256" height="256" rx="32" ry="32" />
    </clipPath>
    <linearGradient id="bg-grad-linear" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFD6E8" /><stop offset="100%" stop-color="#FFB3D9" /></linearGradient>
    <radialGradient id="bg-grad-radial" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#FFB3D9" /><stop offset="100%" stop-color="#FFD6E8" /></radialGradient>
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#FF6B9D" /><stop offset="100%" stop-color="#E04A7B" /></linearGradient>
    <linearGradient id="metal-shine" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" /><stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0" /><stop offset="100%" stop-color="#000000" stop-opacity="0.15" /></linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" fill="url(#bg-grad-linear)" />
  <g clip-path="url(#avatar-clip)">
  <!-- Neck -->
  <rect x="108" y="165" width="40" height="30" rx="4" fill="#E04A7B" stroke="#2B1020" stroke-width="3.5" />
  <line x1="108" y1="173" x2="148" y2="173" stroke="#FFE66D" stroke-width="3" />
  <line x1="108" y1="183" x2="148" y2="183" stroke="#FFE66D" stroke-width="3" />
  <!-- Torso -->
  <path d="M 52 256 L 66 198 Q 72 188 84 188 L 172 188 Q 184 188 190 198 L 204 256 Z" fill="url(#chassis-grad)" stroke="#2B1020" stroke-width="5" />
  <path d="M 84 188 L 172 188 L 166 198 L 90 198 Z" fill="#E04A7B" opacity="0.7" />
  <!-- Chest Badge -->
  <rect x="110" y="216" width="36" height="16" rx="4" fill="#2B1020" />
  <rect x="146" y="220" width="3" height="8" rx="1" fill="#2B1020" />
  <rect x="113" y="219" width="8" height="10" rx="2" fill="#4ECDC4" />  <rect x="123" y="219" width="8" height="10" rx="2" fill="#4ECDC4" />  <rect x="133" y="219" width="8" height="10" rx="2" fill="#FFE66D" />
  <!-- Ears / Side Attachments -->
  <circle cx="44" cy="115" r="15" fill="#E04A7B" stroke="#2B1020" stroke-width="3.5" />  <circle cx="44" cy="115" r="7" fill="#FFE66D" />  <circle cx="212" cy="115" r="15" fill="#E04A7B" stroke="#2B1020" stroke-width="3.5" />  <circle cx="212" cy="115" r="7" fill="#FFE66D" />
  <!-- Head Base -->
  <rect x="52" y="48" width="152" height="132" rx="60" ry="60" fill="url(#chassis-grad)" stroke="#2B1020" stroke-width="5" />
  <circle cx="68" cy="68" r="3.5" fill="#2B1020" />  <circle cx="128" cy="64" r="3.5" fill="#2B1020" />  <circle cx="188" cy="68" r="3.5" fill="#2B1020" />
  <!-- Faceplate Screen -->
  <rect x="66" y="74" width="124" height="88" rx="18" ry="18" fill="#FFFFFF" stroke="#FFE66D" stroke-width="5" />
  <!-- Eyes / Eyewear -->
  <rect x="88" y="98" width="18" height="18" rx="4" fill="#4ECDC4" stroke="#2B1020" stroke-width="3" />  <rect x="150" y="98" width="18" height="18" rx="4" fill="#4ECDC4" stroke="#2B1020" stroke-width="3" />
  <!-- Cheeks -->
  <path d="M 80 138 C 80 138, 73 133, 73 129 C 73 126, 75 125, 77.5 125 C 79 125, 80 126.5, 80 126.5 C 80 126.5, 81 125, 82.5 125 C 85 125, 87 126, 87 129 C 87 133, 80 138, 80 138 Z" fill="#FF85A2" />  <path d="M 176 138 C 176 138, 169 133, 169 129 C 169 126, 171 125, 173.5 125 C 175 125, 176 126.5, 176 126.5 C 176 126.5, 177 125, 178.5 125 C 181 125, 183 126, 183 129 C 183 133, 176 138, 176 138 Z" fill="#FF85A2" />
  <!-- Mouth / Expression -->
  <rect x="108" y="132" width="40" height="18" rx="4" fill="#2B1020" />  <line x1="114" y1="137" x2="142" y2="137" stroke="#FFE66D" stroke-width="2.5" stroke-linecap="round" />  <line x1="114" y1="141" x2="142" y2="141" stroke="#FFE66D" stroke-width="2.5" stroke-linecap="round" />  <line x1="114" y1="145" x2="142" y2="145" stroke="#FFE66D" stroke-width="2.5" stroke-linecap="round" />
  <!-- Hat -->
  <ellipse cx="128" cy="58" rx="62" ry="11" fill="#2B1020" />  <path d="M 86 56 C 86 28, 170 28, 170 56 Z" fill="#2B1020" />  <path d="M 90 56 C 90 32, 166 32, 166 56 Z" fill="#2B1020" />  <path d="M 90 53 Q 128 49 166 53 L 166 56 Q 128 52 90 56 Z" fill="#FFE66D" />
  </g>
