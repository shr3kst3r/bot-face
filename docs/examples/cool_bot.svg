  <rect x="108" y="165" width="40" height="30" rx="4" fill="#CA8A04" stroke="#0A0A14" stroke-width="3.5" />
  <line x1="108" y1="173" x2="148" y2="173" stroke="#F43F5E" stroke-width="3" />
  <line x1="108" y1="183" x2="148" y2="183" stroke="#F43F5E" stroke-width="3" />
