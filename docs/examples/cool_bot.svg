  <circle cx="98" cy="106" r="21" fill="#0A0A14" />  <circle cx="98" cy="106" r="18" fill="#CA8A04" stroke="#F43F5E" stroke-width="3" />  <circle cx="98" cy="106" r="13" fill="#00F5D4" />  <line x1="88" y1="98" x2="104" y2="98" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <circle cx="158" cy="106" r="21" fill="#0A0A14" />  <circle cx="158" cy="106" r="18" fill="#CA8A04" stroke="#F43F5E" stroke-width="3" />  <circle cx="158" cy="106" r="13" fill="#00F5D4" />  <line x1="148" y1="98" x2="164" y2="98" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <rect x="117" y="102" width="22" height="8" rx="2" fill="#F43F5E" stroke="#0A0A14" stroke-width="2" />
