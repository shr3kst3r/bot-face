  <path d="M 76 56 Q 128 20 180 56 Z" fill="#F43F5E" stroke="#0A0A14" stroke-width="4" />  <rect x="72" y="52" width="112" height="15" rx="7" fill="#CA8A04" stroke="#0A0A14" stroke-width="3" />  <circle cx="128" cy="22" r="11" fill="#CA8A04" stroke="#0A0A14" stroke-width="3" />  <circle cx="128" cy="22" r="6" fill="#F43F5E" />
