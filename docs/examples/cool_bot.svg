  <circle cx="128" cy="224" r="16" fill="#0A0A14" />  <circle cx="128" cy="224" r="10" stroke="#F43F5E" stroke-width="3" fill="none" />  <line x1="128" y1="216" x2="128" y2="223" stroke="#F43F5E" stroke-width="3" stroke-linecap="round" />
  <!-- Ears / Side Attachments -->
