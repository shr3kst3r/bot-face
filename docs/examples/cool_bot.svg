  <rect x="108" y="134" width="40" height="16" rx="4" fill="#0A0A14" />  <rect x="112" y="136" width="6" height="12" rx="1" fill="#FFFFFF" />  <rect x="120" y="136" width="6" height="12" rx="1" fill="#FFFFFF" />  <rect x="128" y="136" width="6" height="12" rx="1" fill="#FFFFFF" />  <rect x="136" y="136" width="6" height="12" rx="1" fill="#FFFFFF" />
