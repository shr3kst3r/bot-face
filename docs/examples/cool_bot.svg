  <ellipse cx="80" cy="134" rx="10" ry="7" fill="#F43F5E" opacity="0.9" />  <ellipse cx="176" cy="134" rx="10" ry="7" fill="#F43F5E" opacity="0.9" />
  <!-- Cat Whiskers -->
  <line x1="68" y1="126" x2="38" y2="120" stroke="#0A0A14" stroke-width="3.5" stroke-linecap="round" />
  <line x1="68" y1="134" x2="36" y2="134" stroke="#0A0A14" stroke-width="3.5" stroke-linecap="round" />
  <line x1="68" y1="142" x2="38" y2="148" stroke="#0A0A14" stroke-width="3.5" stroke-linecap="round" />
  <line x1="188" y1="126" x2="218" y2="120" stroke="#0A0A14" stroke-width="3.5" stroke-linecap="round" />
  <line x1="188" y1="134" x2="220" y2="134" stroke="#0A0A14" stroke-width="3.5" stroke-linecap="round" />
  <line x1="188" y1="142" x2="218" y2="148" stroke="#0A0A14" stroke-width="3.5" stroke-linecap="round" />
