<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="avatar-clip">
      <rect x="0" y="0" width="256" height="256" rx="36" ry="36" />
    </clipPath>
    <linearGradient id="bg-grad-linear" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FDF2F8" /><stop offset="100%" stop-color="#FCE7F3" /></linearGradient>
    <radialGradient id="bg-grad-radial" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#FCE7F3" /><stop offset="100%" stop-color="#FDF2F8" /></radialGradient>
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#DB2777" /><stop offset="100%" stop-color="#BE185D" /></linearGradient>
    <linearGradient id="metal-shine" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" /><stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0" /><stop offset="100%" stop-color="#000000" stop-opacity="0.15" /></linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" fill="#FDF2F8" />
  <g clip-path="url(#avatar-clip)">
  <!-- Antenna / Top Gadget -->
  <path d="M 128 54 Q 126 38 128 26" stroke="#10B981" stroke-width="4.5" fill="none" stroke-linecap="round" />  <ellipse cx="120" cy="38" rx="8" ry="4" fill="#10B981" transform="rotate(-30 120 38)" />  <circle cx="128" cy="22" r="8" fill="#84CC16" stroke="#2E0419" stroke-width="2.5" />  <circle cx="128" cy="22" r="4" fill="#FFE66D" />
  <!-- Neck -->
  <rect x="112" y="165" width="32" height="30" rx="6" fill="#2E0419" stroke="#2E0419" stroke-width="3.5" />
  <circle cx="120" cy="172" r="5" fill="#84CC16" />  <circle cx="136" cy="172" r="5" fill="#84CC16" />  <circle cx="120" cy="184" r="5" fill="#84CC16" />  <circle cx="136" cy="184" r="5" fill="#84CC16" />
  <!-- Torso -->
  <path d="M 52 256 L 66 198 Q 72 188 84 188 L 172 188 Q 184 188 190 198 L 204 256 Z" fill="url(#chassis-grad)" stroke="#2E0419" stroke-width="5" />
  <path d="M 84 188 L 172 188 L 166 198 L 90 198 Z" fill="#BE185D" opacity="0.7" />
  <!-- Ears / Side Attachments -->
  <rect x="36" y="100" width="14" height="30" rx="3" fill="#BE185D" stroke="#2E0419" stroke-width="3" />  <line x1="40" y1="107" x2="46" y2="107" stroke="#2E0419" stroke-width="2.5" />  <line x1="40" y1="115" x2="46" y2="115" stroke="#2E0419" stroke-width="2.5" />  <line x1="40" y1="123" x2="46" y2="123" stroke="#2E0419" stroke-width="2.5" />  <rect x="206" y="100" width="14" height="30" rx="3" fill="#BE185D" stroke="#2E0419" stroke-width="3" />  <line x1="210" y1="107" x2="216" y2="107" stroke="#2E0419" stroke-width="2.5" />  <line x1="210" y1="115" x2="216" y2="115" stroke="#2E0419" stroke-width="2.5" />  <line x1="210" y1="123" x2="216" y2="123" stroke="#2E0419" stroke-width="2.5" />
  <!-- Head Base -->
  <circle cx="128" cy="115" r="70" fill="url(#chassis-grad)" stroke="#2E0419" stroke-width="5" />
  <!-- Faceplate Screen -->
  <rect x="66" y="74" width="124" height="88" rx="18" ry="18" fill="#18181B" stroke="#84CC16" stroke-width="5" />
  <!-- Eyes / Eyewear -->
  <circle cx="98" cy="106" r="17" fill="#2E0419" />  <circle cx="98" cy="106" r="14" fill="#06B6D4" />  <circle cx="98" cy="106" r="9" fill="#2E0419" />  <circle cx="95" cy="102" r="4.5" fill="#FFFFFF" />  <circle cx="102" cy="110" r="2" fill="#FFFFFF" />
  <circle cx="158" cy="106" r="17" fill="#2E0419" />  <circle cx="158" cy="106" r="14" fill="#06B6D4" />  <circle cx="158" cy="106" r="9" fill="#2E0419" />  <circle cx="155" cy="102" r="4.5" fill="#FFFFFF" />  <circle cx="162" cy="110" r="2" fill="#FFFFFF" />
  <!-- Cheeks -->
  <ellipse cx="80" cy="134" rx="10" ry="7" fill="#F472B6" opacity="0.9" />  <ellipse cx="176" cy="134" rx="10" ry="7" fill="#F472B6" opacity="0.9" />
  <!-- Mouth / Expression -->
  <rect x="108" y="132" width="40" height="18" rx="4" fill="#2E0419" />  <line x1="114" y1="137" x2="142" y2="137" stroke="#84CC16" stroke-width="2.5" stroke-linecap="round" />  <line x1="114" y1="141" x2="142" y2="141" stroke="#84CC16" stroke-width="2.5" stroke-linecap="round" />  <line x1="114" y1="145" x2="142" y2="145" stroke="#84CC16" stroke-width="2.5" stroke-linecap="round" />
  <!-- Hat -->
  <polygon points="128,14 100,60 156,60" fill="#84CC16" stroke="#2E0419" stroke-width="4" stroke-linejoin="round" />  <polygon points="128,14 116,60 140,60" fill="#BE185D" />  <circle cx="128" cy="14" r="8" fill="#06B6D4" stroke="#2E0419" stroke-width="3" />  <ellipse cx="128" cy="60" rx="28" ry="6" fill="#BE185D" stroke="#2E0419" stroke-width="3" />
  </g>
</svg>
