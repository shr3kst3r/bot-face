<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="avatar-clip">
      <circle cx="128" cy="128" r="128" />
    </clipPath>
    <linearGradient id="bg-grad-linear" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0F172A" /><stop offset="100%" stop-color="#1E293B" /></linearGradient>
    <radialGradient id="bg-grad-radial" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#1E293B" /><stop offset="100%" stop-color="#0F172A" /></radialGradient>
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#0284C7" /><stop offset="100%" stop-color="#0369A1" /></linearGradient>
    <linearGradient id="metal-shine" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" /><stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0" /><stop offset="100%" stop-color="#000000" stop-opacity="0.15" /></linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" fill="#0F172A" />
  <g clip-path="url(#avatar-clip)">
  <!-- Antenna / Top Gadget -->
  <rect x="124" y="38" width="8" height="18" rx="2" fill="#0369A1" stroke="#030712" stroke-width="2.5" />  <circle cx="128" cy="24" r="14" fill="#FDE047" stroke="#030712" stroke-width="3.5" />  <circle cx="124" cy="20" r="4" fill="#FFFFFF" />
  <!-- Neck -->
  <rect x="104" y="168" width="48" height="26" rx="5" fill="#0369A1" stroke="#030712" stroke-width="3.5" />
  <circle cx="112" cy="181" r="3" fill="#030712" />  <circle cx="128" cy="181" r="3" fill="#030712" />  <circle cx="144" cy="181" r="3" fill="#030712" />
  <!-- Torso -->
  <path d="M 52 256 L 66 198 Q 72 188 84 188 L 172 188 Q 184 188 190 198 L 204 256 Z" fill="url(#chassis-grad)" stroke="#030712" stroke-width="5" />
  <path d="M 84 188 L 172 188 L 166 198 L 90 198 Z" fill="#0369A1" opacity="0.7" />
  <!-- Chest Badge -->
  <circle cx="128" cy="224" r="16" fill="#030712" />  <circle cx="128" cy="224" r="12" fill="#38BDF8" />  <circle cx="128" cy="224" r="7" fill="#00F5D4" />  <circle cx="128" cy="224" r="3" fill="#FFFFFF" />
  <!-- Ears / Side Attachments -->
  <rect x="38" y="102" width="12" height="26" rx="3" fill="#0369A1" stroke="#030712" stroke-width="3" />  <rect x="206" y="102" width="12" height="26" rx="3" fill="#0369A1" stroke="#030712" stroke-width="3" />
  <!-- Head Base -->
  <path d="M 50 172 L 50 114 Q 50 48 128 48 Q 206 48 206 114 L 206 172 Q 206 178 198 178 L 58 178 Q 50 178 50 172 Z" fill="url(#chassis-grad)" stroke="#030712" stroke-width="5" />
  <circle cx="68" cy="68" r="3.5" fill="#030712" />  <circle cx="128" cy="64" r="3.5" fill="#030712" />  <circle cx="188" cy="68" r="3.5" fill="#030712" />
  <!-- Faceplate Screen -->
  <rect x="64" y="72" width="128" height="92" rx="20" ry="20" fill="#0369A1" stroke="#030712" stroke-width="3" />  <rect x="70" y="78" width="116" height="80" rx="14" ry="14" fill="#082F49" stroke="#030712" stroke-width="2" />
  <!-- Eyes / Eyewear -->
  <circle cx="98" cy="106" r="13" fill="#38BDF8" />  <circle cx="95" cy="103" r="4" fill="#FFFFFF" />  <circle cx="158" cy="106" r="13" fill="#38BDF8" />  <circle cx="155" cy="103" r="4" fill="#FFFFFF" />
  <circle cx="98" cy="106" r="19" fill="none" stroke="#030712" stroke-width="4.5" />  <circle cx="158" cy="106" r="19" fill="none" stroke="#030712" stroke-width="4.5" />  <line x1="117" y1="106" x2="139" y2="106" stroke="#030712" stroke-width="4.5" stroke-linecap="round" />  <line x1="56" y1="106" x2="79" y2="106" stroke="#030712" stroke-width="3.5" />  <line x1="177" y1="106" x2="200" y2="106" stroke="#030712" stroke-width="3.5" />
  <!-- Cheeks -->
  <path d="M 80 138 C 80 138, 73 133, 73 129 C 73 126, 75 125, 77.5 125 C 79 125, 80 126.5, 80 126.5 C 80 126.5, 81 125, 82.5 125 C 85 125, 87 126, 87 129 C 87 133, 80 138, 80 138 Z" fill="#38BDF8" />  <path d="M 176 138 C 176 138, 169 133, 169 129 C 169 126, 171 125, 173.5 125 C 175 125, 176 126.5, 176 126.5 C 176 126.5, 177 125, 178.5 125 C 181 125, 183 126, 183 129 C 183 133, 176 138, 176 138 Z" fill="#38BDF8" />
