  <path d="M 110 134 Q 128 134 146 134 Q 146 154 128 154 Q 110 154 110 134 Z" fill="#030712" stroke="#030712" stroke-width="3" />  <path d="M 118 144 Q 128 138 138 144 Q 134 152 128 152 Q 122 152 118 144 Z" fill="#FF85A2" />
  </g>
</svg>
