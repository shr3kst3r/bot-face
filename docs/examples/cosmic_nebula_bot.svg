<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="avatar-clip">
      <rect x="0" y="0" width="256" height="256" rx="32" ry="32" />
    </clipPath>
    <linearGradient id="bg-grad-linear" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1E1B4B" /><stop offset="100%" stop-color="#312E81" /></linearGradient>
    <radialGradient id="bg-grad-radial" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#312E81" /><stop offset="100%" stop-color="#1E1B4B" /></radialGradient>
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#7C3AED" /><stop offset="100%" stop-color="#6D28D9" /></linearGradient>
    <linearGradient id="metal-shine" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" /><stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0" /><stop offset="100%" stop-color="#000000" stop-opacity="0.15" /></linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" fill="#1E1B4B" />
  <g clip-path="url(#avatar-clip)">
  <!-- Antenna / Top Gadget -->
  <rect x="124" y="34" width="8" height="22" rx="3" fill="#6D28D9" stroke="#0B0726" stroke-width="3" />  <path d="M 102 36 Q 128 12 154 36 Z" fill="#F43F5E" stroke="#0B0726" stroke-width="3.5" />  <circle cx="128" cy="28" r="5" fill="#0B0726" />  <line x1="128" y1="28" x2="128" y2="14" stroke="#0B0726" stroke-width="3.5" stroke-linecap="round" />  <circle cx="128" cy="14" r="4" fill="#38BDF8" />
  <!-- Neck -->
  <rect x="112" y="165" width="32" height="30" rx="6" fill="#0B0726" stroke="#0B0726" stroke-width="3.5" />
  <circle cx="120" cy="172" r="5" fill="#F43F5E" />  <circle cx="136" cy="172" r="5" fill="#F43F5E" />  <circle cx="120" cy="184" r="5" fill="#F43F5E" />  <circle cx="136" cy="184" r="5" fill="#F43F5E" />
  <!-- Torso -->
  <path d="M 52 256 L 66 198 Q 72 188 84 188 L 172 188 Q 184 188 190 198 L 204 256 Z" fill="url(#chassis-grad)" stroke="#0B0726" stroke-width="5" />
  <path d="M 84 188 L 172 188 L 166 198 L 90 198 Z" fill="#6D28D9" opacity="0.7" />
  <!-- Chest Badge -->
  <circle cx="128" cy="224" r="16" fill="#0B0726" />  <circle cx="128" cy="224" r="10" stroke="#F43F5E" stroke-width="3" fill="none" />  <line x1="128" y1="216" x2="128" y2="223" stroke="#F43F5E" stroke-width="3" stroke-linecap="round" />
  <!-- Ears / Side Attachments -->
  <rect x="38" y="102" width="12" height="26" rx="3" fill="#6D28D9" stroke="#0B0726" stroke-width="3" />  <rect x="206" y="102" width="12" height="26" rx="3" fill="#6D28D9" stroke="#0B0726" stroke-width="3" />
  <!-- Head Base -->
  <polygon points="80,50 176,50 208,114 176,176 80,176 48,114" fill="url(#chassis-grad)" stroke="#0B0726" stroke-width="5" stroke-linejoin="round" />
  <circle cx="68" cy="68" r="3.5" fill="#0B0726" />  <circle cx="128" cy="64" r="3.5" fill="#0B0726" />  <circle cx="188" cy="68" r="3.5" fill="#0B0726" />
  <!-- Faceplate Screen -->
  <rect x="66" y="74" width="124" height="88" rx="18" ry="18" fill="#0F172A" stroke="#0B0726" stroke-width="3" />
  <!-- Eyes / Eyewear -->
  <polygon points="98,90 102,100 112,100 104,107 107,117 98,111 89,117 92,107 84,100 94,100" fill="#38BDF8" stroke="#0B0726" stroke-width="2.5" stroke-linejoin="round" />  <polygon points="158,90 162,100 172,100 164,107 167,117 158,111 149,117 152,107 144,100 154,100" fill="#38BDF8" stroke="#0B0726" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Mouth / Expression -->
  <path d="M 110 138 Q 120 130 128 136 Q 136 130 146 138 Q 140 146 128 140 Q 116 146 110 138 Z" fill="#0B0726" />  <line x1="116" y1="146" x2="140" y2="146" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round" />
  <!-- Hat -->
  <path d="M 78 58 Q 128 26 178 58 Z" fill="#6D28D9" stroke="#0B0726" stroke-width="4" />  <path d="M 78 58 Q 104 38 128 30 L 128 58 Z" fill="#F43F5E" />  <path d="M 128 30 Q 152 38 178 58 L 128 58 Z" fill="#38BDF8" />  <rect x="125" y="20" width="6" height="14" rx="2" fill="#0B0726" />  <ellipse cx="112" cy="20" rx="16" ry="5" fill="#F43F5E" stroke="#0B0726" stroke-width="2" transform="rotate(-15 112 20)" />  <ellipse cx="144" cy="20" rx="16" ry="5" fill="#F43F5E" stroke="#0B0726" stroke-width="2" transform="rotate(15 144 20)" />  <circle cx="128" cy="20" r="5" fill="#0B0726" />
  </g>
</svg>
