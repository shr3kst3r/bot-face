  <polygon points="98,92 101,101 110,101 103,107 106,116 98,111 90,116 93,107 86,101 95,101" fill="#38BDF8" />  <polygon points="158,92 161,101 170,101 163,107 166,116 158,111 150,116 153,107 146,101 155,101" fill="#38BDF8" />
