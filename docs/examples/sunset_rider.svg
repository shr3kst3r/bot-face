  <path d="M 50 172 L 50 114 Q 50 48 128 48 Q 206 48 206 114 L 206 172 Q 206 178 198 178 L 58 178 Q 50 178 50 172 Z" fill="url(#chassis-grad)" stroke="#EA580C" stroke-width="4" />
  <circle cx="128" cy="66" r="8" fill="#EA580C" />  <circle cx="128" cy="66" r="5" fill="#A855F7" />  <circle cx="126" cy="64" r="1.5" fill="#FFFFFF" />
  <!-- Faceplate Screen -->
  <rect x="66" y="74" width="124" height="88" rx="18" ry="18" fill="#1E1B4B" />
