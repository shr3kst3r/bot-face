  <circle cx="128" cy="224" r="16" fill="#0F172A" />  <circle cx="128" cy="224" r="10" stroke="#A855F7" stroke-width="3" fill="none" />  <line x1="128" y1="216" x2="128" y2="223" stroke="#A855F7" stroke-width="3" stroke-linecap="round" />
  <!-- Ears / Side Attachments -->
  <rect x="40" y="102" width="10" height="26" rx="3" fill="#EA580C" />  <rect x="206" y="102" width="10" height="26" rx="3" fill="#EA580C" />
