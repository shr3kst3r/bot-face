<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="avatar-clip">
      <rect x="0" y="0" width="256" height="256" rx="20" ry="20" />
    </clipPath>
    <linearGradient id="bg-grad-linear" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFE5D9" /><stop offset="100%" stop-color="#FFCAD4" /></linearGradient>
    <radialGradient id="bg-grad-radial" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#FFCAD4" /><stop offset="100%" stop-color="#FFE5D9" /></radialGradient>
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#FF6F59" /><stop offset="100%" stop-color="#DB4C37" /></linearGradient>
    <linearGradient id="metal-shine" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" /><stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0" /><stop offset="100%" stop-color="#000000" stop-opacity="0.15" /></linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" fill="url(#bg-grad-radial)" />
  <g clip-path="url(#avatar-clip)">
  <!-- Neck -->
  <rect x="108" y="165" width="40" height="30" rx="4" fill="#DB4C37" />
  <line x1="108" y1="172" x2="148" y2="172" stroke="#43BCCD" stroke-width="3" />
  <line x1="108" y1="182" x2="148" y2="182" stroke="#43BCCD" stroke-width="3" />
  <!-- Torso -->
  <path d="M 56 256 L 68 198 Q 72 190 84 190 L 172 190 Q 184 190 188 198 L 200 256 Z" fill="url(#chassis-grad)" />
  <path d="M 84 190 L 172 190 L 166 200 L 90 200 Z" fill="#DB4C37" opacity="0.6" />
  <!-- Ears / Side Attachments -->
  <rect x="36" y="98" width="14" height="34" rx="4" fill="#DB4C37" />  <circle cx="43" cy="115" r="4" fill="#192A28" />  <rect x="206" y="98" width="14" height="34" rx="4" fill="#DB4C37" />  <circle cx="213" cy="115" r="4" fill="#192A28" />
  <!-- Robot Cat Ears -->
  <polygon points="56,80 82,34 98,72" fill="#FF6F59" />  <polygon points="64,74 82,44 92,68" fill="#43BCCD" />  <polygon points="200,80 174,34 158,72" fill="#FF6F59" />  <polygon points="192,74 174,44 164,68" fill="#43BCCD" />
  <!-- Head Base -->
  <rect x="48" y="54" width="160" height="124" rx="24" ry="24" fill="url(#chassis-grad)" stroke="#DB4C37" stroke-width="4" />
  <!-- Faceplate Screen -->
  <rect x="66" y="74" width="124" height="88" rx="18" ry="18" fill="#254441" stroke="#43BCCD" stroke-width="4" />
  <!-- Eyes / Eyewear -->
  <path d="M 86 114 L 98 98 L 110 114" fill="none" stroke="#F6C85F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />  <path d="M 146 114 L 158 98 L 170 114" fill="none" stroke="#F6C85F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Cheeks -->
  <ellipse cx="80" cy="134" rx="9" ry="6" fill="#FF8E72" opacity="0.85" />  <ellipse cx="176" cy="134" rx="9" ry="6" fill="#FF8E72" opacity="0.85" />
  <!-- Mouth / Expression -->
  <rect x="106" y="132" width="44" height="18" rx="5" fill="#192A28" />  <path d="M 110 141 L 118 141 L 123 134 L 128 148 L 133 136 L 138 141 L 146 141" fill="none" stroke="#F6C85F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
