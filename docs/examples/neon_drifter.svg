<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="avatar-clip">
      <rect x="0" y="0" width="256" height="256" rx="20" ry="20" />
    </clipPath>
    <linearGradient id="bg-grad-linear" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFE5D9" /><stop offset="100%" stop-color="#FFCAD4" /></linearGradient>
    <radialGradient id="bg-grad-radial" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#FFCAD4" /><stop offset="100%" stop-color="#FFE5D9" /></radialGradient>
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#FF6F59" /><stop offset="100%" stop-color="#DB4C37" /></linearGradient>
    <linearGradient id="metal-shine" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" /><stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0" /><stop offset="100%" stop-color="#000000" stop-opacity="0.15" /></linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" fill="#FFE5D9" />
  <g clip-path="url(#avatar-clip)">
  <!-- Neck -->
  <rect x="108" y="165" width="40" height="30" rx="4" fill="#DB4C37" stroke="#26100D" stroke-width="3.5" />
  <line x1="108" y1="173" x2="148" y2="173" stroke="#43BCCD" stroke-width="3" />
  <line x1="108" y1="183" x2="148" y2="183" stroke="#43BCCD" stroke-width="3" />
  <!-- Torso -->
  <path d="M 52 256 L 66 198 Q 72 188 84 188 L 172 188 Q 184 188 190 198 L 204 256 Z" fill="url(#chassis-grad)" stroke="#26100D" stroke-width="5" />
  <path d="M 84 188 L 172 188 L 166 198 L 90 198 Z" fill="#DB4C37" opacity="0.7" />
  <!-- Chest Badge -->
  <circle cx="128" cy="224" r="18" fill="#254441" stroke="#26100D" stroke-width="3" />
  <path d="M 128 232 C 128 232, 117 225, 117 219 C 117 215, 120 213, 124 213 C 126 213, 128 215, 128 215 C 128 215, 130 213, 132 213 C 136 213, 139 215, 139 219 C 139 225, 128 232, 128 232 Z" fill="#43BCCD" stroke="#26100D" stroke-width="1.5" />
  <!-- Ears / Side Attachments -->
  <rect x="34" y="98" width="16" height="34" rx="4" fill="#DB4C37" stroke="#26100D" stroke-width="3.5" />  <circle cx="42" cy="115" r="4" fill="#26100D" />  <rect x="206" y="98" width="16" height="34" rx="4" fill="#DB4C37" stroke="#26100D" stroke-width="3.5" />  <circle cx="214" cy="115" r="4" fill="#26100D" />
  <!-- Robot Bear Ears -->
  <circle cx="70" cy="56" r="23" fill="#FF6F59" stroke="#26100D" stroke-width="4" />  <circle cx="70" cy="56" r="13" fill="#43BCCD" />  <circle cx="186" cy="56" r="23" fill="#FF6F59" stroke="#26100D" stroke-width="4" />  <circle cx="186" cy="56" r="13" fill="#43BCCD" />
  <!-- Head Base -->
  <rect x="48" y="54" width="160" height="124" rx="26" ry="26" fill="url(#chassis-grad)" stroke="#26100D" stroke-width="5" />
  <!-- Faceplate Screen -->
  <rect x="66" y="74" width="124" height="88" rx="18" ry="18" fill="#254441" stroke="#26100D" stroke-width="4" />
  <!-- Eyes / Eyewear -->
  <polygon points="98,90 102,100 112,100 104,107 107,117 98,111 89,117 92,107 84,100 94,100" fill="#F6C85F" stroke="#26100D" stroke-width="2.5" stroke-linejoin="round" />  <polygon points="158,90 162,100 172,100 164,107 167,117 158,111 149,117 152,107 144,100 154,100" fill="#F6C85F" stroke="#26100D" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Mouth / Expression -->
  <path d="M 112 136 Q 120 146 128 138 Q 136 146 144 136" fill="none" stroke="#26100D" stroke-width="6" stroke-linecap="round" />  <path d="M 112 136 Q 120 146 128 138 Q 136 146 144 136" fill="none" stroke="#43BCCD" stroke-width="3.5" stroke-linecap="round" />
  </g>
</svg>
