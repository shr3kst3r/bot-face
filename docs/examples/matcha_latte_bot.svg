  <polygon points="128,14 100,60 156,60" fill="#F97316" stroke="#162905" stroke-width="4" stroke-linejoin="round" />  <polygon points="128,14 116,60 140,60" fill="#65A30D" />  <circle cx="128" cy="14" r="8" fill="#FEF08A" stroke="#162905" stroke-width="3" />  <ellipse cx="128" cy="60" rx="28" ry="6" fill="#65A30D" stroke="#162905" stroke-width="3" />
