<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="avatar-clip">
      <rect x="0" y="0" width="256" height="256" rx="32" ry="32" />
    </clipPath>
    <linearGradient id="bg-grad-linear" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#F0FDF4" /><stop offset="100%" stop-color="#DCFCE7" /></linearGradient>
    <radialGradient id="bg-grad-radial" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#DCFCE7" /><stop offset="100%" stop-color="#F0FDF4" /></radialGradient>
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#84CC16" /><stop offset="100%" stop-color="#65A30D" /></linearGradient>
    <linearGradient id="metal-shine" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" /><stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0" /><stop offset="100%" stop-color="#000000" stop-opacity="0.15" /></linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" fill="url(#bg-grad-linear)" />
  <g clip-path="url(#avatar-clip)">
