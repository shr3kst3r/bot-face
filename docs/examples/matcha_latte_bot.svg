  <path d="M 86 114 L 98 98 L 110 114" fill="none" stroke="#162905" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />  <path d="M 86 114 L 98 98 L 110 114" fill="none" stroke="#FEF08A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />  <path d="M 146 114 L 158 98 L 170 114" fill="none" stroke="#162905" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />  <path d="M 146 114 L 158 98 L 170 114" fill="none" stroke="#FEF08A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
