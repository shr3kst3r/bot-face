  <path d="M 80 58 Q 128 28 176 58 Z" fill="#65A30D" />  <path d="M 80 58 Q 104 38 128 32 L 128 58 Z" fill="#F97316" />  <path d="M 128 32 Q 152 38 176 58 L 128 58 Z" fill="#FEF08A" />  <rect x="126" y="22" width="4" height="12" fill="#052E16" />  <ellipse cx="114" cy="22" rx="14" ry="4" fill="#F97316" transform="rotate(-15 114 22)" />  <ellipse cx="142" cy="22" rx="14" ry="4" fill="#F97316" transform="rotate(15 142 22)" />  <circle cx="128" cy="22" r="4" fill="#052E16" />
