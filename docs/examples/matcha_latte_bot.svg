  <rect x="146" y="220" width="3" height="8" rx="1" fill="#162905" />
  <rect x="113" y="219" width="8" height="10" rx="2" fill="#FEF08A" />  <rect x="123" y="219" width="8" height="10" rx="2" fill="#FEF08A" />  <rect x="133" y="219" width="8" height="10" rx="2" fill="#F97316" />
