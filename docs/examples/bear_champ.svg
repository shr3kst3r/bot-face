  <!-- Mouth / Expression -->
  <path d="M 108 136 Q 128 154 148 136" fill="none" stroke="#2E1503" stroke-width="7" stroke-linecap="round" />  <path d="M 108 136 Q 128 154 148 136" fill="none" stroke="#FDE047" stroke-width="4.5" stroke-linecap="round" />  <circle cx="108" cy="136" r="3" fill="#2E1503" />  <circle cx="148" cy="136" r="3" fill="#2E1503" />
