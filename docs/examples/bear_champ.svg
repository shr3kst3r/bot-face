  <!-- Ears / Side Attachments -->
  <rect x="36" y="100" width="14" height="30" rx="3" fill="#D97706" stroke="#2E1503" stroke-width="3" />  <line x1="40" y1="107" x2="46" y2="107" stroke="#2E1503" stroke-width="2.5" />  <line x1="40" y1="115" x2="46" y2="115" stroke="#2E1503" stroke-width="2.5" />  <line x1="40" y1="123" x2="46" y2="123" stroke="#2E1503" stroke-width="2.5" />  <rect x="206" y="100" width="14" height="30" rx="3" fill="#D97706" stroke="#2E1503" stroke-width="3" />  <line x1="210" y1="107" x2="216" y2="107" stroke="#2E1503" stroke-width="2.5" />  <line x1="210" y1="115" x2="216" y2="115" stroke="#2E1503" stroke-width="2.5" />  <line x1="210" y1="123" x2="216" y2="123" stroke="#2E1503" stroke-width="2.5" />
