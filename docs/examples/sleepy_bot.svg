  <rect x="106" y="132" width="44" height="18" rx="5" fill="#1C0D38" />  <path d="M 110 141 L 118 141 L 123 134 L 128 148 L 133 136 L 138 141 L 146 141" fill="none" stroke="#3A86FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
