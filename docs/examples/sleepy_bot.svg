  <path d="M 84 188 L 172 188 L 166 198 L 90 198 Z" fill="#6218CC" opacity="0.7" />
  <ellipse cx="128" cy="192" rx="34" ry="6" fill="#1C0D38" opacity="0.22" />
  <!-- Chest Badge -->
  <circle cx="128" cy="224" r="16" fill="#1C0D38" />  <circle cx="128" cy="224" r="12" fill="#3A86FF" />  <circle cx="128" cy="224" r="7" fill="#FFBE0B" />  <circle cx="128" cy="224" r="3" fill="#FFFFFF" />
  <!-- Ears / Side Attachments -->
  <rect x="38" y="102" width="12" height="26" rx="3" fill="#6218CC" stroke="#1C0D38" stroke-width="3" />  <rect x="206" y="102" width="12" height="26" rx="3" fill="#6218CC" stroke="#1C0D38" stroke-width="3" />
  <!-- Robot Cat Ears -->
  <polygon points="56,80 82,30 102,72" fill="#8338EC" stroke="#1C0D38" stroke-width="4" stroke-linejoin="round" />  <polygon points="64,74 82,42 94,68" fill="#FFBE0B" />  <polygon points="200,80 174,30 154,72" fill="#8338EC" stroke="#1C0D38" stroke-width="4" stroke-linejoin="round" />  <polygon points="192,74 174,42 162,68" fill="#FFBE0B" />
  <!-- Head Base -->
  <rect x="48" y="54" width="160" height="124" rx="26" ry="26" fill="url(#chassis-grad)" stroke="#1C0D38" stroke-width="5" />
