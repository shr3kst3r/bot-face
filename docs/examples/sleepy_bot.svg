  <!-- Neck -->
  <rect x="108" y="165" width="40" height="30" rx="4" fill="#6218CC" stroke="#1C0D38" stroke-width="3.5" />
  <line x1="108" y1="173" x2="148" y2="173" stroke="#FFBE0B" stroke-width="3" />
  <line x1="108" y1="183" x2="148" y2="183" stroke="#FFBE0B" stroke-width="3" />
