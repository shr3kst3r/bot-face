  <circle cx="158" cy="106" r="17" fill="#1C0D38" />  <circle cx="158" cy="106" r="14" fill="#3A86FF" />  <ellipse cx="158" cy="106" rx="3.5" ry="11" fill="#1C0D38" />  <circle cx="154" cy="101" r="3.5" fill="#FFFFFF" />
