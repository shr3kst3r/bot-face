  <polygon points="86,60 80,32 106,46 128,24 150,46 176,32 170,60" fill="#FFD166" stroke="#1C0D38" stroke-width="3.5" stroke-linejoin="round" />  <circle cx="80" cy="32" r="4.5" fill="#FFBE0B" stroke="#1C0D38" stroke-width="2" />  <circle cx="128" cy="24" r="5.5" fill="#FFBE0B" stroke="#1C0D38" stroke-width="2" />  <circle cx="176" cy="32" r="4.5" fill="#FFBE0B" stroke="#1C0D38" stroke-width="2" />  <circle cx="128" cy="48" r="4.5" fill="#3A86FF" stroke="#1C0D38" stroke-width="1.5" />
