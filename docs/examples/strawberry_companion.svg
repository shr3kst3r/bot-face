<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="avatar-clip">
      <rect x="0" y="0" width="256" height="256" rx="32" ry="32" />
    </clipPath>
    <linearGradient id="bg-grad-linear" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FDF2F8" /><stop offset="100%" stop-color="#FCE7F3" /></linearGradient>
    <radialGradient id="bg-grad-radial" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#FCE7F3" /><stop offset="100%" stop-color="#FDF2F8" /></radialGradient>
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#F43F5E" /><stop offset="100%" stop-color="#E11D48" /></linearGradient>
    <linearGradient id="metal-shine" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" /><stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0" /><stop offset="100%" stop-color="#000000" stop-opacity="0.15" /></linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" fill="url(#bg-grad-radial)" />
  <g clip-path="url(#avatar-clip)">
  <!-- Neck -->
  <rect x="112" y="165" width="32" height="30" rx="6" fill="#330612" stroke="#330612" stroke-width="3.5" />
  <circle cx="120" cy="172" r="5" fill="#84CC16" />  <circle cx="136" cy="172" r="5" fill="#84CC16" />  <circle cx="120" cy="184" r="5" fill="#84CC16" />  <circle cx="136" cy="184" r="5" fill="#84CC16" />
  <!-- Torso -->
  <path d="M 52 256 L 66 198 Q 72 188 84 188 L 172 188 Q 184 188 190 198 L 204 256 Z" fill="url(#chassis-grad)" stroke="#330612" stroke-width="5" />
  <path d="M 84 188 L 172 188 L 166 198 L 90 198 Z" fill="#E11D48" opacity="0.7" />
  <!-- Ears / Side Attachments -->
