  <path d="M 110 136 Q 128 150 146 136" fill="none" stroke="#0A0A14" stroke-width="5" stroke-linecap="round" />  <polygon points="116,136 122,136 119,144" fill="#FFFFFF" stroke="#0A0A14" stroke-width="1.5" />  <polygon points="134,136 140,136 137,144" fill="#FFFFFF" stroke="#0A0A14" stroke-width="1.5" />
