  <polygon points="86,60 80,32 106,46 128,24 150,46 176,32 170,60" fill="#FFD166" stroke="#0A0A14" stroke-width="3.5" stroke-linejoin="round" />  <circle cx="80" cy="32" r="4.5" fill="#F43F5E" stroke="#0A0A14" stroke-width="2" />  <circle cx="128" cy="24" r="5.5" fill="#F43F5E" stroke="#0A0A14" stroke-width="2" />  <circle cx="176" cy="32" r="4.5" fill="#F43F5E" stroke="#0A0A14" stroke-width="2" />  <circle cx="128" cy="48" r="4.5" fill="#00F5D4" stroke="#0A0A14" stroke-width="1.5" />
