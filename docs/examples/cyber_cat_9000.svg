  <rect x="48" y="54" width="160" height="124" rx="26" ry="26" fill="url(#chassis-grad)" stroke="#0A0A14" stroke-width="5" />
  <circle cx="128" cy="66" r="9" fill="#0A0A14" />  <circle cx="128" cy="66" r="6" fill="#F43F5E" />  <circle cx="126" cy="64" r="1.5" fill="#FFFFFF" />
