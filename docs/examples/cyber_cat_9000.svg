  <circle cx="76" cy="133" r="2.5" fill="#0A0A14" />  <circle cx="82" cy="136" r="2.5" fill="#0A0A14" />  <circle cx="88" cy="133" r="2.5" fill="#0A0A14" />  <circle cx="168" cy="133" r="2.5" fill="#0A0A14" />  <circle cx="174" cy="136" r="2.5" fill="#0A0A14" />  <circle cx="180" cy="133" r="2.5" fill="#0A0A14" />
