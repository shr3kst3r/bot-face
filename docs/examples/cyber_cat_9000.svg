  <circle cx="158" cy="106" r="17" fill="#0A0A14" />  <circle cx="158" cy="106" r="14" fill="#00F5D4" />  <circle cx="158" cy="106" r="9" fill="#0A0A14" />  <circle cx="155" cy="102" r="4.5" fill="#FFFFFF" />  <circle cx="162" cy="110" r="2" fill="#FFFFFF" />
