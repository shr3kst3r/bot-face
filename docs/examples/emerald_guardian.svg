    <radialGradient id="bg-grad-radial" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#C8F2E7" /><stop offset="100%" stop-color="#E8F8F5" /></radialGradient>
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#10B981" /><stop offset="100%" stop-color="#059669" /></linearGradient>
