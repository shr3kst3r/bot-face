  <circle cx="68" cy="68" r="3.5" fill="#064E3B" />  <circle cx="128" cy="64" r="3.5" fill="#064E3B" />  <circle cx="188" cy="68" r="3.5" fill="#064E3B" />
  <!-- Faceplate Screen -->
  <rect x="66" y="74" width="124" height="88" rx="18" ry="18" fill="#0F172A" stroke="#059669" stroke-width="3" />
