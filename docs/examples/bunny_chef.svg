<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="avatar-clip">
      <rect x="0" y="0" width="256" height="256" rx="32" ry="32" />
    </clipPath>
    <linearGradient id="bg-grad-linear" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFF1F2" /><stop offset="100%" stop-color="#FFE4E6" /></linearGradient>
    <radialGradient id="bg-grad-radial" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#FFE4E6" /><stop offset="100%" stop-color="#FFF1F2" /></radialGradient>
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#FB7185" /><stop offset="100%" stop-color="#E11D48" /></linearGradient>
    <linearGradient id="metal-shine" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" /><stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0" /><stop offset="100%" stop-color="#000000" stop-opacity="0.15" /></linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" fill="#FFF1F2" />
  <g clip-path="url(#avatar-clip)">
  <!-- Antenna / Top Gadget -->
  <polygon points="80,56 72,22 96,44" fill="#EF4444" stroke="#330914" stroke-width="3.5" stroke-linejoin="round" />  <polygon points="176,56 184,22 160,44" fill="#EF4444" stroke="#330914" stroke-width="3.5" stroke-linejoin="round" />
  <!-- Neck -->
  <rect x="112" y="165" width="32" height="30" rx="6" fill="#330914" stroke="#330914" stroke-width="3.5" />
  <circle cx="120" cy="172" r="5" fill="#FBBF24" />  <circle cx="136" cy="172" r="5" fill="#FBBF24" />  <circle cx="120" cy="184" r="5" fill="#FBBF24" />  <circle cx="136" cy="184" r="5" fill="#FBBF24" />
  <!-- Torso -->
  <path d="M 52 256 L 66 198 Q 72 188 84 188 L 172 188 Q 184 188 190 198 L 204 256 Z" fill="url(#chassis-grad)" stroke="#330914" stroke-width="5" />
  <path d="M 84 188 L 172 188 L 166 198 L 90 198 Z" fill="#E11D48" opacity="0.7" />
  <!-- Chest Badge -->
  <polygon points="112,216 112,232 128,224" fill="#FBBF24" stroke="#330914" stroke-width="2" />  <polygon points="144,216 144,232 128,224" fill="#FBBF24" stroke="#330914" stroke-width="2" />  <circle cx="128" cy="224" r="4.5" fill="#330914" />
  <!-- Ears / Side Attachments -->
  <rect x="36" y="100" width="14" height="30" rx="3" fill="#E11D48" stroke="#330914" stroke-width="3" />  <line x1="40" y1="107" x2="46" y2="107" stroke="#330914" stroke-width="2.5" />  <line x1="40" y1="115" x2="46" y2="115" stroke="#330914" stroke-width="2.5" />  <line x1="40" y1="123" x2="46" y2="123" stroke="#330914" stroke-width="2.5" />  <rect x="206" y="100" width="14" height="30" rx="3" fill="#E11D48" stroke="#330914" stroke-width="3" />  <line x1="210" y1="107" x2="216" y2="107" stroke="#330914" stroke-width="2.5" />  <line x1="210" y1="115" x2="216" y2="115" stroke="#330914" stroke-width="2.5" />  <line x1="210" y1="123" x2="216" y2="123" stroke="#330914" stroke-width="2.5" />
  <!-- Head Base -->
  <path d="M 50 172 L 50 114 Q 50 48 128 48 Q 206 48 206 114 L 206 172 Q 206 178 198 178 L 58 178 Q 50 178 50 172 Z" fill="url(#chassis-grad)" stroke="#330914" stroke-width="5" />
  <circle cx="128" cy="66" r="9" fill="#330914" />  <circle cx="128" cy="66" r="6" fill="#FBBF24" />  <circle cx="126" cy="64" r="1.5" fill="#FFFFFF" />
  <!-- Faceplate Screen -->
  <rect x="66" y="74" width="124" height="88" rx="18" ry="18" fill="#4C0519" stroke="#330914" stroke-width="3" />
  <!-- Eyes / Eyewear -->
  <path d="M 86 108 L 98 96 L 110 108" fill="none" stroke="#330914" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />  <path d="M 86 108 L 98 96 L 110 108" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="158" cy="106" r="17" fill="#330914" />  <circle cx="158" cy="106" r="14" fill="#34D399" />  <circle cx="158" cy="106" r="9" fill="#330914" />  <circle cx="155" cy="102" r="4.5" fill="#FFFFFF" />  <circle cx="162" cy="110" r="2" fill="#FFFFFF" />
  <!-- Cheeks -->
  <ellipse cx="80" cy="134" rx="10" ry="7" fill="#FDA4AF" opacity="0.9" />  <ellipse cx="176" cy="134" rx="10" ry="7" fill="#FDA4AF" opacity="0.9" />
  <!-- Mouth / Expression -->
  <path d="M 108 136 Q 128 154 148 136" fill="none" stroke="#330914" stroke-width="7" stroke-linecap="round" />  <path d="M 108 136 Q 128 154 148 136" fill="none" stroke="#FBBF24" stroke-width="4.5" stroke-linecap="round" />  <circle cx="108" cy="136" r="3" fill="#330914" />  <circle cx="148" cy="136" r="3" fill="#330914" />
  <!-- Hat -->
  <polygon points="128,14 100,60 156,60" fill="#FBBF24" stroke="#330914" stroke-width="4" stroke-linejoin="round" />  <polygon points="128,14 116,60 140,60" fill="#E11D48" />  <circle cx="128" cy="14" r="8" fill="#34D399" stroke="#330914" stroke-width="3" />  <ellipse cx="128" cy="60" rx="28" ry="6" fill="#E11D48" stroke="#330914" stroke-width="3" />
  </g>
</svg>
