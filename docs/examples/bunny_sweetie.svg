  <!-- Ears / Side Attachments -->
  <rect x="38" y="102" width="12" height="26" rx="3" fill="#E11D48" stroke="#330914" stroke-width="3" />  <rect x="206" y="102" width="12" height="26" rx="3" fill="#E11D48" stroke="#330914" stroke-width="3" />
  <!-- Robot Bunny Ears -->
  <rect x="72" y="14" width="22" height="52" rx="11" fill="#FB7185" stroke="#330914" stroke-width="4" />  <rect x="77" y="22" width="12" height="36" rx="6" fill="#FBBF24" />  <rect x="162" y="14" width="22" height="52" rx="11" fill="#FB7185" stroke="#330914" stroke-width="4" />  <rect x="167" y="22" width="12" height="36" rx="6" fill="#FBBF24" />
  <!-- Head Base -->
  <rect x="48" y="54" width="160" height="124" rx="26" ry="26" fill="url(#chassis-grad)" stroke="#330914" stroke-width="5" />
