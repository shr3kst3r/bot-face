  <line x1="68" y1="126" x2="38" y2="120" stroke="#330914" stroke-width="3.5" stroke-linecap="round" />
  <line x1="68" y1="134" x2="36" y2="134" stroke="#330914" stroke-width="3.5" stroke-linecap="round" />
  <line x1="68" y1="142" x2="38" y2="148" stroke="#330914" stroke-width="3.5" stroke-linecap="round" />
  <line x1="188" y1="126" x2="218" y2="120" stroke="#330914" stroke-width="3.5" stroke-linecap="round" />
  <line x1="188" y1="134" x2="220" y2="134" stroke="#330914" stroke-width="3.5" stroke-linecap="round" />
  <line x1="188" y1="142" x2="218" y2="148" stroke="#330914" stroke-width="3.5" stroke-linecap="round" />
