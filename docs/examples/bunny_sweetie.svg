  <path d="M 92 56 L 92 46 C 70 38, 80 14, 106 20 C 114 6, 142 6, 150 20 C 176 14, 186 38, 164 46 L 164 56 Z" fill="#FFFFFF" stroke="#330914" stroke-width="4" stroke-linejoin="round" />  <rect x="90" y="50" width="76" height="12" rx="3" fill="#F1F5F9" stroke="#330914" stroke-width="3" />
