  <rect x="108" y="133" width="40" height="16" rx="4" fill="#0A1E24" />  <rect x="112" y="141" width="4" height="4" rx="1" fill="#48CAE4" />  <rect x="118" y="139" width="4" height="6" rx="1" fill="#48CAE4" />  <rect x="124" y="136" width="4" height="9" rx="1" fill="#48CAE4" />  <rect x="130" y="138" width="4" height="7" rx="1" fill="#FF3366" />  <rect x="136" y="141" width="4" height="4" rx="1" fill="#FF3366" />
