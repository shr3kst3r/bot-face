<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="avatar-clip">
      <rect x="0" y="0" width="256" height="256" rx="32" ry="32" />
    </clipPath>
    <linearGradient id="bg-grad-linear" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFD6E8" /><stop offset="100%" stop-color="#FFB3D9" /></linearGradient>
    <radialGradient id="bg-grad-radial" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#FFB3D9" /><stop offset="100%" stop-color="#FFD6E8" /></radialGradient>
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#FF6B9D" /><stop offset="100%" stop-color="#E04A7B" /></linearGradient>
    <linearGradient id="metal-shine" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" /><stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0" /><stop offset="100%" stop-color="#000000" stop-opacity="0.15" /></linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" fill="#FFD6E8" />
  <g clip-path="url(#avatar-clip)">
  <!-- Antenna / Top Gadget -->
  <rect x="124" y="24" width="8" height="32" rx="4" fill="#E04A7B" stroke="#2B1020" stroke-width="3" />  <circle cx="128" cy="22" r="13" fill="#FFE66D" stroke="#2B1020" stroke-width="3.5" />  <circle cx="124" cy="18" r="4" fill="#FFFFFF" />
  <!-- Neck -->
  <rect x="106" y="166" width="44" height="28" rx="4" fill="#FFE66D" stroke="#2B1020" stroke-width="3.5" />  <circle cx="128" cy="184" r="10" fill="#FFD166" stroke="#2B1020" stroke-width="3" />  <circle cx="128" cy="186" r="2.5" fill="#2B1020" />  <line x1="128" y1="188" x2="128" y2="194" stroke="#2B1020" stroke-width="2" />
  <!-- Torso -->
  <path d="M 52 256 L 66 198 Q 72 188 84 188 L 172 188 Q 184 188 190 198 L 204 256 Z" fill="url(#chassis-grad)" stroke="#2B1020" stroke-width="5" />
  <path d="M 84 188 L 172 188 L 166 198 L 90 198 Z" fill="#E04A7B" opacity="0.7" />
  <ellipse cx="128" cy="192" rx="34" ry="6" fill="#2B1020" opacity="0.22" />
  <!-- Ears / Side Attachments -->
  <circle cx="44" cy="115" r="15" fill="#E04A7B" stroke="#2B1020" stroke-width="3.5" />  <circle cx="44" cy="115" r="7" fill="#FFE66D" />  <circle cx="212" cy="115" r="15" fill="#E04A7B" stroke="#2B1020" stroke-width="3.5" />  <circle cx="212" cy="115" r="7" fill="#FFE66D" />
  <!-- Head Base -->
  <circle cx="128" cy="115" r="70" fill="url(#chassis-grad)" stroke="#2B1020" stroke-width="5" />
  <!-- Head Highlights & Shadows -->
  <path d="M 64 62 Q 128 54 186 62 Q 128 67 64 62 Z" fill="#FFFFFF" opacity="0.35" />
  <path d="M 194 80 L 194 156 Q 186 170 170 172 L 170 166 Q 186 164 186 80 Z" fill="#2B1020" opacity="0.18" />
  <circle cx="68" cy="68" r="3.5" fill="#2B1020" />  <circle cx="128" cy="64" r="3.5" fill="#2B1020" />  <circle cx="188" cy="68" r="3.5" fill="#2B1020" />
  <!-- Faceplate Screen -->
  <rect x="66" y="74" width="124" height="88" rx="18" ry="18" fill="#FFFFFF" stroke="#2B1020" stroke-width="3" />
  <!-- Glass Sheen -->
  <polygon points="74,80 114,80 88,154 74,154" fill="#FFFFFF" opacity="0.12" />
  <!-- Eyes / Eyewear -->
  <path d="M 86 108 L 98 96 L 110 108" fill="none" stroke="#2B1020" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />  <path d="M 86 108 L 98 96 L 110 108" fill="none" stroke="#4ECDC4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="158" cy="106" r="17" fill="#2B1020" />  <circle cx="158" cy="106" r="14" fill="#4ECDC4" />  <circle cx="158" cy="106" r="9" fill="#2B1020" />  <circle cx="155" cy="102" r="4.5" fill="#FFFFFF" />  <circle cx="162" cy="110" r="2" fill="#FFFFFF" />
  <!-- Cheeks -->
  <ellipse cx="80" cy="134" rx="10" ry="7" fill="#FF85A2" opacity="0.9" />  <ellipse cx="176" cy="134" rx="10" ry="7" fill="#FF85A2" opacity="0.9" />
  <!-- Cat Whiskers -->
  <line x1="68" y1="126" x2="38" y2="120" stroke="#2B1020" stroke-width="3.5" stroke-linecap="round" />
  <line x1="68" y1="134" x2="36" y2="134" stroke="#2B1020" stroke-width="3.5" stroke-linecap="round" />
  <line x1="68" y1="142" x2="38" y2="148" stroke="#2B1020" stroke-width="3.5" stroke-linecap="round" />
  <line x1="188" y1="126" x2="218" y2="120" stroke="#2B1020" stroke-width="3.5" stroke-linecap="round" />
  <line x1="188" y1="134" x2="220" y2="134" stroke="#2B1020" stroke-width="3.5" stroke-linecap="round" />
  <line x1="188" y1="142" x2="218" y2="148" stroke="#2B1020" stroke-width="3.5" stroke-linecap="round" />
  <!-- Mouth / Expression -->
  <path d="M 110 136 Q 128 150 146 136" fill="none" stroke="#2B1020" stroke-width="5" stroke-linecap="round" />  <polygon points="116,136 122,136 119,144" fill="#FFFFFF" stroke="#2B1020" stroke-width="1.5" />  <polygon points="134,136 140,136 137,144" fill="#FFFFFF" stroke="#2B1020" stroke-width="1.5" />
  <!-- Hat -->
  <path d="M 78 58 Q 128 26 178 58 Z" fill="#E04A7B" stroke="#2B1020" stroke-width="4" />  <path d="M 78 58 Q 104 38 128 30 L 128 58 Z" fill="#FFE66D" />  <path d="M 128 30 Q 152 38 178 58 L 128 58 Z" fill="#4ECDC4" />  <rect x="125" y="20" width="6" height="14" rx="2" fill="#2B1020" />  <ellipse cx="112" cy="20" rx="16" ry="5" fill="#FFE66D" stroke="#2B1020" stroke-width="2" transform="rotate(-15 112 20)" />  <ellipse cx="144" cy="20" rx="16" ry="5" fill="#FFE66D" stroke="#2B1020" stroke-width="2" transform="rotate(15 144 20)" />  <circle cx="128" cy="20" r="5" fill="#2B1020" />
  </g>
</svg>
