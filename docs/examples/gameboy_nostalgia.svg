<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="avatar-clip">
      <rect x="0" y="0" width="256" height="256" />
    </clipPath>
    <linearGradient id="bg-grad-linear" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#B8F2E6" /><stop offset="100%" stop-color="#84E6D2" /></linearGradient>
    <radialGradient id="bg-grad-radial" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#84E6D2" /><stop offset="100%" stop-color="#B8F2E6" /></radialGradient>
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#2EC4B6" /><stop offset="100%" stop-color="#1E9B8F" /></linearGradient>
    <linearGradient id="metal-shine" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" /><stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0" /><stop offset="100%" stop-color="#000000" stop-opacity="0.15" /></linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" fill="url(#bg-grad-linear)" />
  <g clip-path="url(#avatar-clip)">
  <!-- Neck -->
  <rect x="110" y="165" width="36" height="30" rx="5" fill="#1E9B8F" stroke="#0A1E24" stroke-width="3.5" />
  <!-- Torso -->
  <path d="M 52 256 L 66 198 Q 72 188 84 188 L 172 188 Q 184 188 190 198 L 204 256 Z" fill="url(#chassis-grad)" stroke="#0A1E24" stroke-width="5" />
  <path d="M 84 188 L 172 188 L 166 198 L 90 198 Z" fill="#1E9B8F" opacity="0.7" />
  <!-- Ears / Side Attachments -->
  <rect x="38" y="102" width="12" height="26" rx="3" fill="#1E9B8F" stroke="#0A1E24" stroke-width="3" />  <rect x="206" y="102" width="12" height="26" rx="3" fill="#1E9B8F" stroke="#0A1E24" stroke-width="3" />
  <!-- Head Base -->
  <polygon points="80,50 176,50 208,114 176,176 80,176 48,114" fill="url(#chassis-grad)" stroke="#0A1E24" stroke-width="5" stroke-linejoin="round" />
  <!-- Faceplate Screen -->
  <rect x="68" y="76" width="120" height="84" rx="16" ry="16" fill="#1E9B8F" opacity="0.4" stroke="#0A1E24" stroke-width="3" />  <rect x="70" y="78" width="116" height="80" rx="14" ry="14" fill="#1A2238" />
  <!-- Eyes / Eyewear -->
  <rect x="50" y="100" width="156" height="12" rx="3" fill="#0A1E24" />
  <circle cx="98" cy="106" r="21" fill="#0A1E24" />  <circle cx="98" cy="106" r="18" fill="#1E9B8F" stroke="#FF3366" stroke-width="3" />  <circle cx="98" cy="106" r="13" fill="#48CAE4" />  <line x1="88" y1="98" x2="104" y2="98" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <circle cx="158" cy="106" r="21" fill="#0A1E24" />  <circle cx="158" cy="106" r="18" fill="#1E9B8F" stroke="#FF3366" stroke-width="3" />  <circle cx="158" cy="106" r="13" fill="#48CAE4" />  <line x1="148" y1="98" x2="164" y2="98" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <rect x="117" y="102" width="22" height="8" rx="2" fill="#FF3366" stroke="#0A1E24" stroke-width="2" />
  <!-- Mouth / Expression -->
  <rect x="106" y="132" width="44" height="18" rx="5" fill="#0A1E24" />  <path d="M 110 141 L 118 141 L 123 134 L 128 148 L 133 136 L 138 141 L 146 141" fill="none" stroke="#48CAE4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Hat -->
  <polygon points="86,60 80,32 106,46 128,24 150,46 176,32 170,60" fill="#FFD166" stroke="#0A1E24" stroke-width="3.5" stroke-linejoin="round" />  <circle cx="80" cy="32" r="4.5" fill="#FF3366" stroke="#0A1E24" stroke-width="2" />  <circle cx="128" cy="24" r="5.5" fill="#FF3366" stroke="#0A1E24" stroke-width="2" />  <circle cx="176" cy="32" r="4.5" fill="#FF3366" stroke="#0A1E24" stroke-width="2" />  <circle cx="128" cy="48" r="4.5" fill="#48CAE4" stroke="#0A1E24" stroke-width="1.5" />
  </g>
</svg>
