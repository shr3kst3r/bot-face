  <path d="M 52 256 L 66 198 Q 72 188 84 188 L 172 188 Q 184 188 190 198 L 204 256 Z" fill="url(#chassis-grad)" stroke="#2B1D0C" stroke-width="5" />
  <path d="M 84 188 L 172 188 L 166 198 L 90 198 Z" fill="#F4A261" opacity="0.7" />
  <ellipse cx="128" cy="192" rx="34" ry="6" fill="#2B1D0C" opacity="0.22" />
  <!-- Chest Badge -->
  <circle cx="128" cy="224" r="16" fill="#264653" stroke="#2B1D0C" stroke-width="2.5" />  <ellipse cx="128" cy="227" rx="6.5" ry="5" fill="#EF476F" />  <circle cx="122" cy="218" r="2.5" fill="#EF476F" />  <circle cx="126" cy="216" r="2.5" fill="#EF476F" />  <circle cx="130" cy="216" r="2.5" fill="#EF476F" />  <circle cx="134" cy="218" r="2.5" fill="#EF476F" />
  <!-- Ears / Side Attachments -->
  <rect x="36" y="100" width="14" height="30" rx="3" fill="#F4A261" stroke="#2B1D0C" stroke-width="3" />  <line x1="40" y1="107" x2="46" y2="107" stroke="#2B1D0C" stroke-width="2.5" />  <line x1="40" y1="115" x2="46" y2="115" stroke="#2B1D0C" stroke-width="2.5" />  <line x1="40" y1="123" x2="46" y2="123" stroke="#2B1D0C" stroke-width="2.5" />  <rect x="206" y="100" width="14" height="30" rx="3" fill="#F4A261" stroke="#2B1D0C" stroke-width="3" />  <line x1="210" y1="107" x2="216" y2="107" stroke="#2B1D0C" stroke-width="2.5" />  <line x1="210" y1="115" x2="216" y2="115" stroke="#2B1D0C" stroke-width="2.5" />  <line x1="210" y1="123" x2="216" y2="123" stroke="#2B1D0C" stroke-width="2.5" />
