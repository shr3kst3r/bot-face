  <polygon points="56,80 82,30 102,72" fill="#FFD166" stroke="#2B1D0C" stroke-width="4" stroke-linejoin="round" />  <polygon points="64,74 82,42 94,68" fill="#EF476F" />  <polygon points="200,80 174,30 154,72" fill="#FFD166" stroke="#2B1D0C" stroke-width="4" stroke-linejoin="round" />  <polygon points="192,74 174,42 162,68" fill="#EF476F" />
  <!-- Head Base -->
  <rect x="48" y="54" width="160" height="124" rx="26" ry="26" fill="url(#chassis-grad)" stroke="#2B1D0C" stroke-width="5" />
