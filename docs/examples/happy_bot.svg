  <polygon points="74,80 114,80 88,154 74,154" fill="#FFFFFF" opacity="0.12" />
  <!-- Eyes / Eyewear -->
  <circle cx="98" cy="106" r="18" fill="#2B1D0C" />  <circle cx="98" cy="106" r="15" fill="#06D6A0" />  <circle cx="98" cy="106" r="10" fill="#2B1D0C" />  <circle cx="94" cy="101" r="5" fill="#FFFFFF" />  <circle cx="103" cy="109" r="3" fill="#FFFFFF" />  <circle cx="95" cy="111" r="1.5" fill="#FFFFFF" />
  <circle cx="158" cy="106" r="18" fill="#2B1D0C" />  <circle cx="158" cy="106" r="15" fill="#06D6A0" />  <circle cx="158" cy="106" r="10" fill="#2B1D0C" />  <circle cx="154" cy="101" r="5" fill="#FFFFFF" />  <circle cx="163" cy="109" r="3" fill="#FFFFFF" />  <circle cx="155" cy="111" r="1.5" fill="#FFFFFF" />
  <!-- Cheeks -->
  <ellipse cx="80" cy="134" rx="10" ry="7" fill="#F78C6B" opacity="0.9" />  <ellipse cx="176" cy="134" rx="10" ry="7" fill="#F78C6B" opacity="0.9" />
  <!-- Mouth / Expression -->
  <path d="M 110 134 Q 128 134 146 134 Q 146 154 128 154 Q 110 154 110 134 Z" fill="#2B1D0C" stroke="#2B1D0C" stroke-width="3" />  <path d="M 118 144 Q 128 138 138 144 Q 134 152 128 152 Q 122 152 118 144 Z" fill="#FF85A2" />
  <!-- Hat -->
  <polygon points="128,14 100,60 156,60" fill="#EF476F" stroke="#2B1D0C" stroke-width="4" stroke-linejoin="round" />  <polygon points="128,14 116,60 140,60" fill="#F4A261" />  <circle cx="128" cy="14" r="8" fill="#06D6A0" stroke="#2B1D0C" stroke-width="3" />  <ellipse cx="128" cy="60" rx="28" ry="6" fill="#F4A261" stroke="#2B1D0C" stroke-width="3" />
