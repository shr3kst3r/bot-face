  <path d="M 194 80 L 194 156 Q 186 170 170 172 L 170 166 Q 186 164 186 80 Z" fill="#2B1D0C" opacity="0.18" />
  <rect x="122" y="50" width="12" height="24" rx="3" fill="#EF476F" stroke="#2B1D0C" stroke-width="2" />
