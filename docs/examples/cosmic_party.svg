<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="avatar-clip">
      <rect x="0" y="0" width="256" height="256" rx="28" ry="28" />
    </clipPath>
    <linearGradient id="bg-grad-linear" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#E8EAFF" /><stop offset="100%" stop-color="#D0D5FF" /></linearGradient>
    <radialGradient id="bg-grad-radial" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#D0D5FF" /><stop offset="100%" stop-color="#E8EAFF" /></radialGradient>
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#8338EC" /><stop offset="100%" stop-color="#6218CC" /></linearGradient>
    <linearGradient id="metal-shine" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" /><stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0" /><stop offset="100%" stop-color="#000000" stop-opacity="0.15" /></linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" fill="url(#bg-grad-linear)" />
  <g clip-path="url(#avatar-clip)">
  <!-- Antenna / Top Gadget -->
  <path d="M 88 56 L 82 46 L 94 38 L 84 28 L 90 20" stroke="#1C0D38" stroke-width="4.5" fill="none" stroke-linecap="round" />  <circle cx="90" cy="16" r="10" fill="#FFBE0B" stroke="#1C0D38" stroke-width="3.5" />  <circle cx="88" cy="14" r="3" fill="#FFFFFF" />  <path d="M 168 56 L 174 46 L 162 38 L 172 28 L 166 20" stroke="#1C0D38" stroke-width="4.5" fill="none" stroke-linecap="round" />  <circle cx="166" cy="16" r="10" fill="#FFBE0B" stroke="#1C0D38" stroke-width="3.5" />  <circle cx="164" cy="14" r="3" fill="#FFFFFF" />
  <!-- Neck -->
  <rect x="110" y="165" width="36" height="30" rx="5" fill="#6218CC" stroke="#1C0D38" stroke-width="3.5" />
  <!-- Torso -->
  <path d="M 52 256 L 66 198 Q 72 188 84 188 L 172 188 Q 184 188 190 198 L 204 256 Z" fill="url(#chassis-grad)" stroke="#1C0D38" stroke-width="5" />
  <path d="M 84 188 L 172 188 L 166 198 L 90 198 Z" fill="#6218CC" opacity="0.7" />
  <!-- Chest Badge -->
  <polygon points="112,216 112,232 128,224" fill="#FFBE0B" stroke="#1C0D38" stroke-width="2" />  <polygon points="144,216 144,232 128,224" fill="#FFBE0B" stroke="#1C0D38" stroke-width="2" />  <circle cx="128" cy="224" r="4.5" fill="#1C0D38" />
  <!-- Ears / Side Attachments -->
  <rect x="36" y="100" width="14" height="30" rx="3" fill="#6218CC" stroke="#1C0D38" stroke-width="3" />  <line x1="40" y1="107" x2="46" y2="107" stroke="#1C0D38" stroke-width="2.5" />  <line x1="40" y1="115" x2="46" y2="115" stroke="#1C0D38" stroke-width="2.5" />  <line x1="40" y1="123" x2="46" y2="123" stroke="#1C0D38" stroke-width="2.5" />  <rect x="206" y="100" width="14" height="30" rx="3" fill="#6218CC" stroke="#1C0D38" stroke-width="3" />  <line x1="210" y1="107" x2="216" y2="107" stroke="#1C0D38" stroke-width="2.5" />  <line x1="210" y1="115" x2="216" y2="115" stroke="#1C0D38" stroke-width="2.5" />  <line x1="210" y1="123" x2="216" y2="123" stroke="#1C0D38" stroke-width="2.5" />
  <!-- Head Base -->
  <rect x="52" y="48" width="152" height="132" rx="60" ry="60" fill="url(#chassis-grad)" stroke="#1C0D38" stroke-width="5" />
  <circle cx="68" cy="68" r="3.5" fill="#1C0D38" />  <circle cx="128" cy="64" r="3.5" fill="#1C0D38" />  <circle cx="188" cy="68" r="3.5" fill="#1C0D38" />
  <!-- Faceplate Screen -->
  <rect x="66" y="74" width="124" height="88" rx="18" ry="18" fill="#FFFFFF" stroke="#1C0D38" stroke-width="3" />
  <!-- Eyes / Eyewear -->
  <circle cx="98" cy="106" r="17" fill="#1C0D38" />  <circle cx="98" cy="106" r="14" fill="#3A86FF" />  <circle cx="98" cy="106" r="9" fill="#1C0D38" />  <circle cx="95" cy="102" r="4.5" fill="#FFFFFF" />  <circle cx="102" cy="110" r="2" fill="#FFFFFF" />
  <circle cx="158" cy="106" r="17" fill="#1C0D38" />  <circle cx="158" cy="106" r="14" fill="#3A86FF" />  <circle cx="158" cy="106" r="9" fill="#1C0D38" />  <circle cx="155" cy="102" r="4.5" fill="#FFFFFF" />  <circle cx="162" cy="110" r="2" fill="#FFFFFF" />
  <!-- Mouth / Expression -->
  <rect x="108" y="133" width="40" height="16" rx="4" fill="#1C0D38" />  <rect x="112" y="141" width="4" height="4" rx="1" fill="#3A86FF" />  <rect x="118" y="139" width="4" height="6" rx="1" fill="#3A86FF" />  <rect x="124" y="136" width="4" height="9" rx="1" fill="#3A86FF" />  <rect x="130" y="138" width="4" height="7" rx="1" fill="#FFBE0B" />  <rect x="136" y="141" width="4" height="4" rx="1" fill="#FFBE0B" />
  </g>
</svg>
