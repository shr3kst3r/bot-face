  <path d="M 78 56 Q 128 22 178 56 Z" fill="#00F5D4" />  <rect x="74" y="52" width="108" height="14" rx="7" fill="#7837C7" />  <circle cx="128" cy="24" r="10" fill="#7837C7" />  <circle cx="128" cy="24" r="6" fill="#00F5D4" />
