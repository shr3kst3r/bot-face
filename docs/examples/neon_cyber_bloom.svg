  <path d="M 110 136 Q 128 152 146 136" fill="none" stroke="#00F5D4" stroke-width="4.5" stroke-linecap="round" />  <circle cx="110" cy="136" r="2.5" fill="#00F5D4" />  <circle cx="146" cy="136" r="2.5" fill="#00F5D4" />
