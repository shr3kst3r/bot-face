  <polygon points="56,80 82,30 102,72" fill="#9B5DE5" stroke="#190730" stroke-width="4" stroke-linejoin="round" />  <polygon points="64,74 82,42 94,68" fill="#00F5D4" />  <polygon points="200,80 174,30 154,72" fill="#9B5DE5" stroke="#190730" stroke-width="4" stroke-linejoin="round" />  <polygon points="192,74 174,42 162,68" fill="#00F5D4" />
