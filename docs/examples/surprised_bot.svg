  <path d="M 194 80 L 194 156 Q 186 170 170 172 L 170 166 Q 186 164 186 80 Z" fill="#190730" opacity="0.18" />
  <circle cx="68" cy="68" r="3.5" fill="#190730" />  <circle cx="128" cy="64" r="3.5" fill="#190730" />  <circle cx="188" cy="68" r="3.5" fill="#190730" />
