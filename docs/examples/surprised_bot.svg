  <line x1="68" y1="134" x2="36" y2="134" stroke="#190730" stroke-width="3.5" stroke-linecap="round" />
  <line x1="68" y1="142" x2="38" y2="148" stroke="#190730" stroke-width="3.5" stroke-linecap="round" />
  <line x1="188" y1="126" x2="218" y2="120" stroke="#190730" stroke-width="3.5" stroke-linecap="round" />
  <line x1="188" y1="134" x2="220" y2="134" stroke="#190730" stroke-width="3.5" stroke-linecap="round" />
  <line x1="188" y1="142" x2="218" y2="148" stroke="#190730" stroke-width="3.5" stroke-linecap="round" />
  <!-- Mouth / Expression -->
  <circle cx="128" cy="141" r="8" fill="#190730" />  <circle cx="128" cy="141" r="5.5" fill="#00F5D4" />  <circle cx="128" cy="141" r="3" fill="#1D1135" />
