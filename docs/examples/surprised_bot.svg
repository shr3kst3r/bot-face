  <path d="M 84 188 L 172 188 L 166 198 L 90 198 Z" fill="#7837C7" opacity="0.7" />
  <ellipse cx="128" cy="192" rx="34" ry="6" fill="#190730" opacity="0.22" />
  <!-- Chest Badge -->
  <polygon points="112,216 112,232 128,224" fill="#00F5D4" stroke="#190730" stroke-width="2" />  <polygon points="144,216 144,232 128,224" fill="#00F5D4" stroke="#190730" stroke-width="2" />  <circle cx="128" cy="224" r="4.5" fill="#190730" />
  <!-- Ears / Side Attachments -->
  <rect x="36" y="100" width="14" height="30" rx="3" fill="#7837C7" stroke="#190730" stroke-width="3" />  <line x1="40" y1="107" x2="46" y2="107" stroke="#190730" stroke-width="2.5" />  <line x1="40" y1="115" x2="46" y2="115" stroke="#190730" stroke-width="2.5" />  <line x1="40" y1="123" x2="46" y2="123" stroke="#190730" stroke-width="2.5" />  <rect x="206" y="100" width="14" height="30" rx="3" fill="#7837C7" stroke="#190730" stroke-width="3" />  <line x1="210" y1="107" x2="216" y2="107" stroke="#190730" stroke-width="2.5" />  <line x1="210" y1="115" x2="216" y2="115" stroke="#190730" stroke-width="2.5" />  <line x1="210" y1="123" x2="216" y2="123" stroke="#190730" stroke-width="2.5" />
