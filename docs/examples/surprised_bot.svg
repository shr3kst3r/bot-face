  <rect x="104" y="168" width="48" height="26" rx="5" fill="#7837C7" stroke="#190730" stroke-width="3.5" />
  <circle cx="112" cy="181" r="3" fill="#190730" />  <circle cx="128" cy="181" r="3" fill="#190730" />  <circle cx="144" cy="181" r="3" fill="#190730" />
