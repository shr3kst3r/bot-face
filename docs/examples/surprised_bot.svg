  <circle cx="158" cy="106" r="18" fill="#190730" />  <circle cx="158" cy="106" r="15" fill="#F15BB5" />  <circle cx="158" cy="106" r="10" fill="#190730" />  <circle cx="154" cy="101" r="5" fill="#FFFFFF" />  <circle cx="163" cy="109" r="3" fill="#FFFFFF" />  <circle cx="155" cy="111" r="1.5" fill="#FFFFFF" />
  <!-- Cheeks -->
  <ellipse cx="80" cy="134" rx="10" ry="7" fill="#F15BB5" opacity="0.9" />  <ellipse cx="176" cy="134" rx="10" ry="7" fill="#F15BB5" opacity="0.9" />
