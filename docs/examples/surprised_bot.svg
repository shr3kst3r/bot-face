  <rect x="64" y="72" width="128" height="92" rx="20" ry="20" fill="#7837C7" stroke="#190730" stroke-width="3" />  <rect x="70" y="78" width="116" height="80" rx="14" ry="14" fill="#1D1135" stroke="#190730" stroke-width="2" />
