  <path d="M 110 136 Q 128 152 146 136" fill="none" stroke="#0096C7" stroke-width="4.5" stroke-linecap="round" />  <circle cx="110" cy="136" r="2.5" fill="#0096C7" />  <circle cx="146" cy="136" r="2.5" fill="#0096C7" />
