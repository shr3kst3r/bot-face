  <circle cx="98" cy="106" r="19" fill="#0096C7" stroke="#FEE440" stroke-width="3" />  <circle cx="98" cy="106" r="14" fill="#00F5D4" />  <line x1="88" y1="98" x2="102" y2="98" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <circle cx="158" cy="106" r="19" fill="#0096C7" stroke="#FEE440" stroke-width="3" />  <circle cx="158" cy="106" r="14" fill="#00F5D4" />  <line x1="148" y1="98" x2="162" y2="98" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8" />
