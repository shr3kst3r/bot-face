  <circle cx="98" cy="106" r="17" fill="#101033" />  <circle cx="98" cy="106" r="14" fill="#06B6D4" />  <circle cx="98" cy="106" r="9" fill="#101033" />  <circle cx="95" cy="102" r="4.5" fill="#FFFFFF" />  <circle cx="102" cy="110" r="2" fill="#FFFFFF" />
  <circle cx="158" cy="106" r="17" fill="#101033" />  <circle cx="158" cy="106" r="14" fill="#06B6D4" />  <circle cx="158" cy="106" r="9" fill="#101033" />  <circle cx="155" cy="102" r="4.5" fill="#FFFFFF" />  <circle cx="162" cy="110" r="2" fill="#FFFFFF" />
