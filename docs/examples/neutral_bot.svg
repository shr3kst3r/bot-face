  <line x1="68" y1="134" x2="36" y2="134" stroke="#101033" stroke-width="3.5" stroke-linecap="round" />
  <line x1="68" y1="142" x2="38" y2="148" stroke="#101033" stroke-width="3.5" stroke-linecap="round" />
  <line x1="188" y1="126" x2="218" y2="120" stroke="#101033" stroke-width="3.5" stroke-linecap="round" />
  <line x1="188" y1="134" x2="220" y2="134" stroke="#101033" stroke-width="3.5" stroke-linecap="round" />
  <line x1="188" y1="142" x2="218" y2="148" stroke="#101033" stroke-width="3.5" stroke-linecap="round" />
  <!-- Mouth / Expression -->
  <rect x="108" y="132" width="40" height="18" rx="4" fill="#101033" />  <line x1="114" y1="137" x2="142" y2="137" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round" />  <line x1="114" y1="141" x2="142" y2="141" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round" />  <line x1="114" y1="145" x2="142" y2="145" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round" />
  <!-- Hat -->
  <polygon points="128,14 100,60 156,60" fill="#F43F5E" stroke="#101033" stroke-width="4" stroke-linejoin="round" />  <polygon points="128,14 116,60 140,60" fill="#4338CA" />  <circle cx="128" cy="14" r="8" fill="#06B6D4" stroke="#101033" stroke-width="3" />  <ellipse cx="128" cy="60" rx="28" ry="6" fill="#4338CA" stroke="#101033" stroke-width="3" />
