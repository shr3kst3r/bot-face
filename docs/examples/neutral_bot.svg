<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="avatar-clip">
      <rect x="0" y="0" width="256" height="256" rx="24" ry="24" />
    </clipPath>
    <linearGradient id="bg-grad-linear" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#E0E7FF" /><stop offset="100%" stop-color="#C7D2FE" /></linearGradient>
    <radialGradient id="bg-grad-radial" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#C7D2FE" /><stop offset="100%" stop-color="#E0E7FF" /></radialGradient>
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#6366F1" /><stop offset="100%" stop-color="#4338CA" /></linearGradient>
    <linearGradient id="metal-shine" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" /><stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0" /><stop offset="100%" stop-color="#000000" stop-opacity="0.15" /></linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" fill="#E0E7FF" />
