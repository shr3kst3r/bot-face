<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="avatar-clip">
      <rect x="0" y="0" width="256" height="256" />
    </clipPath>
    <linearGradient id="bg-grad-linear" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFD6E8" /><stop offset="100%" stop-color="#FFB3D9" /></linearGradient>
    <radialGradient id="bg-grad-radial" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#FFB3D9" /><stop offset="100%" stop-color="#FFD6E8" /></radialGradient>
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#FF6B9D" /><stop offset="100%" stop-color="#E04A7B" /></linearGradient>
    <linearGradient id="metal-shine" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" /><stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0" /><stop offset="100%" stop-color="#000000" stop-opacity="0.15" /></linearGradient>
  </defs>
  <g clip-path="url(#avatar-clip)">
  <!-- Antenna / Top Gadget -->
  <path d="M 128 54 Q 126 38 128 26" stroke="#10B981" stroke-width="4.5" fill="none" stroke-linecap="round" />  <ellipse cx="120" cy="38" rx="8" ry="4" fill="#10B981" transform="rotate(-30 120 38)" />  <circle cx="128" cy="22" r="8" fill="#FFE66D" stroke="#2B1020" stroke-width="2.5" />  <circle cx="128" cy="22" r="4" fill="#FFE66D" />
  <!-- Neck -->
  <rect x="106" y="166" width="44" height="28" rx="4" fill="#FFE66D" stroke="#2B1020" stroke-width="3.5" />  <circle cx="128" cy="184" r="10" fill="#FFD166" stroke="#2B1020" stroke-width="3" />  <circle cx="128" cy="186" r="2.5" fill="#2B1020" />  <line x1="128" y1="188" x2="128" y2="194" stroke="#2B1020" stroke-width="2" />
  <!-- Torso -->
  <path d="M 52 256 L 66 198 Q 72 188 84 188 L 172 188 Q 184 188 190 198 L 204 256 Z" fill="url(#chassis-grad)" stroke="#2B1020" stroke-width="5" />
  <path d="M 84 188 L 172 188 L 166 198 L 90 198 Z" fill="#E04A7B" opacity="0.7" />
  <ellipse cx="128" cy="192" rx="34" ry="6" fill="#2B1020" opacity="0.22" />
  <!-- Chest Badge -->
  <circle cx="128" cy="224" r="16" fill="#2B1020" />  <circle cx="128" cy="224" r="12" fill="#4ECDC4" />  <circle cx="128" cy="224" r="7" fill="#FFE66D" />  <circle cx="128" cy="224" r="3" fill="#FFFFFF" />
  <!-- Ears / Side Attachments -->
  <circle cx="44" cy="115" r="15" fill="#E04A7B" stroke="#2B1020" stroke-width="3.5" />  <circle cx="44" cy="115" r="7" fill="#FFE66D" />  <circle cx="212" cy="115" r="15" fill="#E04A7B" stroke="#2B1020" stroke-width="3.5" />  <circle cx="212" cy="115" r="7" fill="#FFE66D" />
  <!-- Robot Bear Ears -->
  <circle cx="70" cy="56" r="23" fill="#FF6B9D" stroke="#2B1020" stroke-width="4" />  <circle cx="70" cy="56" r="13" fill="#FFE66D" />  <circle cx="186" cy="56" r="23" fill="#FF6B9D" stroke="#2B1020" stroke-width="4" />  <circle cx="186" cy="56" r="13" fill="#FFE66D" />
  <!-- Head Base -->
  <rect x="48" y="54" width="160" height="124" rx="26" ry="26" fill="url(#chassis-grad)" stroke="#2B1020" stroke-width="5" />
  <!-- Head Highlights & Shadows -->
  <path d="M 64 62 Q 128 54 186 62 Q 128 67 64 62 Z" fill="#FFFFFF" opacity="0.35" />
  <path d="M 194 80 L 194 156 Q 186 170 170 172 L 170 166 Q 186 164 186 80 Z" fill="#2B1020" opacity="0.18" />
  <!-- Faceplate Screen -->
  <rect x="68" y="76" width="120" height="84" rx="16" ry="16" fill="#E04A7B" opacity="0.4" stroke="#2B1020" stroke-width="3" />  <rect x="70" y="78" width="116" height="80" rx="14" ry="14" fill="#FFFFFF" />
  <!-- Glass Sheen -->
  <polygon points="74,80 114,80 88,154 74,154" fill="#FFFFFF" opacity="0.12" />
  <!-- Eyes / Eyewear -->
  <circle cx="98" cy="106" r="17" fill="#2B1020" />  <circle cx="98" cy="106" r="14" fill="#4ECDC4" />  <ellipse cx="98" cy="106" rx="3.5" ry="11" fill="#2B1020" />  <circle cx="94" cy="101" r="3.5" fill="#FFFFFF" />
  <circle cx="158" cy="106" r="17" fill="#2B1020" />  <circle cx="158" cy="106" r="14" fill="#4ECDC4" />  <ellipse cx="158" cy="106" rx="3.5" ry="11" fill="#2B1020" />  <circle cx="154" cy="101" r="3.5" fill="#FFFFFF" />
  <!-- Mouth / Expression -->
  <circle cx="128" cy="141" r="8" fill="#2B1020" />  <circle cx="128" cy="141" r="5.5" fill="#E04A7B" />  <circle cx="128" cy="141" r="3" fill="#FFFFFF" />
  <!-- Hat -->
  <polygon points="128,14 100,60 156,60" fill="#FFE66D" stroke="#2B1020" stroke-width="4" stroke-linejoin="round" />  <polygon points="128,14 116,60 140,60" fill="#E04A7B" />  <circle cx="128" cy="14" r="8" fill="#4ECDC4" stroke="#2B1020" stroke-width="3" />  <ellipse cx="128" cy="60" rx="28" ry="6" fill="#E04A7B" stroke="#2B1020" stroke-width="3" />
  </g>
</svg>
