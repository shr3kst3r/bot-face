[project]
name = "bot-face"
version = "0.1.0"
description = "Cute robot avatar generator library and CLI for account profile images"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
authors = [{ name = "bot-face contributors" }]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "pillow>=10.0",
  "click>=8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ty",
  "ruff>=0.5",
  "pre-commit>=4.0",
]

[project.scripts]
bot-face = "bot_face.cli:main"
bf = "bot_face.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot_face"]

[tool.uv]
python-preference = "only-system"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "TID", "PTH", "N"]
ignore = []

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "PTH"]

[tool.pytest.ini_options]
addopts = "-ra --cov=bot_face --cov-report=term-missing"
testpaths = ["tests"]
